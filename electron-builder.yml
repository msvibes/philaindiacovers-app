appId: com.krutimlogic.philaindiacovers
# T-38 fix, found via a real install test: this was still the scaffold's
# literal package.json `name` value (lowercase, hyphenated) — NSIS uses
# `productName` (not `name`) for user-visible strings: the installer
# window title ("<productName> Setup"), the Start Menu/desktop shortcut
# name, and the Control Panel uninstall entry. `name`/`win.executableName`
# stay "philaindiacovers-app" deliberately (the installer filename and the
# actual .exe filename), unaffected by this change.
productName: PhilaIndiaCovers
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# T-38: Windows/nsis only — this is a Windows desktop app (see package.json's
# own description), no mac/linux distribution is planned. The mac/dmg/linux/
# appImage blocks the electron-vite scaffold generated by default have been
# removed rather than left as unused dead config.
win:
  executableName: philaindiacovers-app
  target: nsis
  # T-38: electron-builder v26's real schema has no root-level
  # `publisherName` (the DISCLAIMER-and-Developer-Details.md §5c snippet
  # this was copied from predates/doesn't match the installed version —
  # verified directly against node_modules/app-builder-lib/scheme.json,
  # not assumed). The only place this field actually exists is here, and
  # it only has any effect during real code signing (it's checked against
  # the signing certificate's subject) — with no certificate configured
  # (T-38's deliberate ship-unsigned decision), this is inert today, not a
  # placeholder: it's the real, final publisher name, pre-set as a guard
  # for whenever real code signing is added later.
  signtoolOptions:
    publisherName: Krutim Logic
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Real EULA content, already drafted and confirmed — see
  # docs/legal/DISCLAIMER-and-Developer-Details.md §4. Not a placeholder.
  license: LEGAL/EULA.txt
npmRebuild: false
# T-38: real GitHub Releases feed, matching the addendum's already-decided
# distribution channel. This only fixes the metadata electron-builder writes
# into build artifacts (and what a future manual `--publish` run would
# target) — it does not wire up auto-update logic itself, since no
# electron-updater dependency exists yet (that's US-47, unstarted).
publish:
  provider: github
  owner: msvibes
  repo: philaindiacovers-app
