<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PhilaIndiaCovers</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- connect-src allows the Supabase project's REST/Auth/Storage API (any
         *.supabase.co project, not one hardcoded ID, since dev vs. prod use
         separate projects). img-src allows blob: for the thumbnail object
         URLs created from downloaded Storage images (see lib/covers.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
