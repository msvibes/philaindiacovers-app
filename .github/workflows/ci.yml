# CI gate mirroring the Admin repo's own (docs/Test-Strategy.md's "CI Gate"
# section is shared across both repos): lint, typecheck, and the full Vitest
# suite (unit + live integration) must all pass before merge. No E2E suite
# exists in this repo (or Admin's) yet, so nothing to run there.
#
# One-time manual setup this workflow depends on and cannot create itself:
# a GitHub Environment named `ci-dev-supabase` (Settings > Environments)
# holding three secrets — VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY — pointed at the DEV Supabase project only,
# never production. Until that environment and its secrets exist, the
# "Verify integration test credentials" step below will fail every run,
# on purpose (see that step for why this is intentional, not a bug).
#
# Note on env var names: this repo uses VITE_-prefixed names (not
# NEXT_PUBLIC_-prefixed like Admin) because electron-vite's renderer reads
# them via import.meta.env, which only exposes VITE_-prefixed vars — see
# src/renderer/src/lib/viteEnvVarsReachTests.test.ts, which exists
# specifically to prove these vars actually reach import.meta.env in CI
# rather than assuming Vite's documented env-loading behavior holds here.
#
# Note on concurrency: this repo and the Admin repo share one dev Supabase
# project, and each has its own independent per-repo concurrency group
# below — a PR pushed to both repos at once could still run live
# integration tests against that shared project concurrently. Accepted for
# now given this app's genuinely small live-data footprint. Trigger
# condition for revisiting, logged explicitly rather than silently
# accepted: if Supabase Auth rate-limit errors are ever actually observed
# in either repo's CI logs, build real cross-repo coordination then, not
# before.
#
# T-38 added a second job, package-windows (windows-latest), that proves
# the electron-builder packaging step actually works on every PR — see
# that job's own inline comment for why its output is a smoke test only,
# never the real distributed installer.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ci-dev-supabase
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify integration test credentials are present
        run: |
          missing=()
          [ -z "$VITE_SUPABASE_URL" ] && missing+=("VITE_SUPABASE_URL")
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing+=("VITE_SUPABASE_ANON_KEY")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Supabase credentials for CI: ${missing[*]}. Without these, the integration test suite (src/**/*.integration.test.ts) would silently skip via describe.skipIf() instead of failing - see docs/Test-Strategy.md's CI Gate section. Add these three secrets to the 'ci-dev-supabase' GitHub Environment (Settings > Environments), pointed at the DEV Supabase project only, never production."
            exit 1
          fi
          echo "All required Supabase credentials are present."

      - name: Test (unit + live integration, including the Vite env-var reach check)
        run: npm test

      - name: Build (also runs the secret-leak guardrail)
        run: npm run build

  # T-38: proves the packaging *mechanism* (electron-builder.yml, icon,
  # NSIS config) actually produces a working installer on every PR — the
  # existing `ci` job above only ever ran `electron-vite build`, never
  # `electron-builder`, so a packaging regression could land silently.
  #
  # IMPORTANT — this job's output artifact is NOT the real trial
  # installer and is never distributed anywhere. It's a smoke test only,
  # built with the same ci-dev-supabase (DEV project) credentials as the
  # rest of CI purely for consistency. The actual installer sent to real
  # friends/family testers must be a deliberate, manual `npm run build:win`
  # run locally with the real .env — see PROGRESS.md's T-38 entry.
  #
  # Not currently a required status check in branch protection (only `ci`
  # is) — that's a separate, manual GitHub Settings change if ever wanted.
  package-windows:
    runs-on: windows-latest
    environment: ci-dev-supabase
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build Windows installer (electron-builder)
        run: npm run build:win
